apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-ingress-le-cert
  namespace: cert-manager
spec:
  secretName: wildcard-ingress-tls-secret
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  commonName: "sleepfox.ru"
  dnsNames:
  - "*.sleepfox.ru"
  - "sleepfox.ru"

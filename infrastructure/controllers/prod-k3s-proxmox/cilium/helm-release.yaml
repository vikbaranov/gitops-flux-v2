apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: cilium-system
spec:
  dependsOn:
    - name: gateway-api
      namespace: flux-system
  values:
    kubeProxyReplacement: true
  
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 6443
  
    ipam:
      mode: kubernetes
  
    l7Proxy: true
  
    gatewayAPI:
      enabled: true
  
    envoy:
      enabled: true
  
    hubble:
      enabled: false
      relay:
        enabled: false
      ui:
        enabled: false
  
    operator:
      replicas: 1
      rollOutPods: true
  
    l2announcements:
      enabled: true
  
    k8sClientRateLimit:
      qps: 20
      burst: 40
  
    rollOutCiliumPods: true

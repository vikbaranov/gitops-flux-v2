apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  values:
    grafana:
      grafana.ini:
        auth:
          disable_login_form: true
        auth.anonymous:
          enabled: true
          org_role: Admin
    vmsingle:
      storage:
        storageClassName: ${storage_class}
        resources:
          requests:
            storage: 3Gi
      route:
        enabled: true
        parentRefs:
          - name: internal
            namespace: envoy-gateway-system
        hostnames:
          - vm.${cluster_subdomain}

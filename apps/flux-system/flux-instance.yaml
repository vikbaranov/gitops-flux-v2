apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.10"
    registry: ghcr.io/fluxcd
  sync:
    kind: GitRepository
    url: https://github.com/vikbaranov/gitops-flux-v2.git
    ref: refs/heads/main
    path: apps
    pullSecret: github
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
    - source-watcher

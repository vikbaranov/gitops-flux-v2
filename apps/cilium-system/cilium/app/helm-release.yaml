# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://quay.io/cilium/charts/cilium
      ref:
        tag: 1.20.5
  interval: 1h
  values:
    kubeProxyReplacement: true
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 6443
    ipam:
      mode: kubernetes
    l7Proxy: true
    gatewayAPI:
      enabled: true
    envoy:
      enabled: true
    hubble:
      enabled: false
      relay:
        enabled: false
      ui:
        enabled: false
    operator:
      replicas: 1
      rollOutPods: true
    l2announcements:
      enabled: true
    k8sClientRateLimit:
      qps: 20
      burst: 40
    rollOutCiliumPods: true

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
spec:
  interval: 15m
  timeout: 5m
  releaseName: qbittorrent
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: lscr.io/linuxserver/qbittorrent
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: Europe/Moscow
              WEBUI_PORT: "8080"
    service:
      main:
        ports:
          http:
            port: 8080
      bittorrent:
        ports:
          bittorrent:
            port: 6881
            protocol: TCP
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      downloads:
        enabled: true
        existingClaim: media-downloads-pvc
        globalMounts:
          - path: /downloads
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
      limits:
        memory: 400Mi

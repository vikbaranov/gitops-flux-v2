apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  chart:
    spec:
      chart: vaultwarden
      version: "0.46.2"
      sourceRef:
        kind: HelmRepository
        name: vaultwarden
  values:
    domain: https://vaultwarden.${cluster_subdomain}
    storage:
      data:
        size: 1Gi
        class: ${storage_class}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: media
spec:
  parentRefs:
    - name: int-gw
      namespace: cilium-system
  hostnames:
    - qbittorrent.${cluster_subdomain}
  rules:
    - backendRefs:
        - name: qbittorrent
          port: 8080

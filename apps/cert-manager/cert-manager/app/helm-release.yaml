# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chart:
    kind: OCIRepository
    spec:
      url: oci://quay.io/jetstack/charts/cert-manager
      ref:
        tag: 1.21.3
  interval: 1h
  values:
    crds:
      enabled: true

